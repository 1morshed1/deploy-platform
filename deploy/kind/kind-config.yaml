# kind (Kubernetes IN Docker) cluster config for local development.
#
#   kind create cluster --config deploy/kind/kind-config.yaml   (or: make kind-up)
#
# This maps the host's ports 80/443 into the cluster so the nginx ingress
# controller is reachable at localhost, letting you hit <subdomain>.apps.localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: deploy-platform
nodes:
  - role: control-plane
    # Labels that let the nginx ingress controller schedule here and be exposed.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Ingress HTTP/HTTPS -> host, so http://<app>.apps.localhost works.
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

# NOTE ON NETWORKPOLICY: kind's default CNI (kindnet) does NOT enforce
# NetworkPolicy. The tenant-isolation policies the operator creates will be
# accepted but IGNORED. To actually test isolation locally, install Calico or
# Cilium as the CNI (see docs/learning/07). For app-level testing, the default CNI
# is fine.
