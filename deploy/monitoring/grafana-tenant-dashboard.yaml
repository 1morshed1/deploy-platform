# A Grafana dashboard delivered as a ConfigMap. The Grafana sidecar (enabled in
# the Helm values) watches for ConfigMaps labeled grafana_dashboard=1 and imports
# their JSON automatically — this is "dashboards as code".
#
# Rather than create one dashboard PER tenant via Grafana's HTTP API, we ship ONE
# templated dashboard with a `namespace` dropdown variable. Selecting a tenant's
# namespace (tenant-<subdomain>) scopes every panel to that tenant. This is simpler
# and cheaper than per-tenant dashboards and covers the same need; the trade-off is
# discussed in learning doc 06.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-tenant-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  tenant-dashboard.json: |
    {
      "title": "Tenant App",
      "uid": "tenant-app",
      "schemaVersion": 39,
      "editable": true,
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(kube_pod_info, namespace)",
            "regex": "/tenant-.*/",
            "refresh": 2,
            "includeAll": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "CPU usage (cores)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Memory working set (bytes)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\", container!=\"\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Pod restarts (total)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"$namespace\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "HTTP request rate (req/s) — apps exporting http_requests_total",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\"}[5m]))",
              "legendFormat": "requests/s"
            }
          ]
        }
      ]
    }
