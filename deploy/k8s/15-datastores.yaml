# DEV-GRADE Postgres + Redis running inside the cluster.
#
# These make `make deploy-platform` work end-to-end on kind with no external
# services. They are single-replica and use emptyDir (data is LOST on restart).
# In production, use managed services (AWS RDS + ElastiCache) instead and point
# DATABASE_URL / REDIS_ADDR at them — then you can delete this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: platform-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
            - { name: POSTGRES_DB, value: deploy_platform }
          ports:
            - containerPort: 5432
          volumeMounts:
            # Optional: auto-apply the schema on first start. Create the ConfigMap
            # with: kubectl -n platform-system create configmap db-init \
            #   --from-file=migrations/0001_init.up.sql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: db-init
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: platform-system
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: platform-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: platform-system
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
