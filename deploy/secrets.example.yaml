# SECRET TEMPLATE — copy, fill in real values, and apply MANUALLY. Do NOT commit
# a filled-in copy (it is gitignored via *.local patterns; keep real secrets out
# of Git entirely). This file is intentionally NOT in deploy/k8s/ so that
# `kubectl apply -f deploy/k8s/` never applies placeholder secrets.
#
#   cp deploy/secrets.example.yaml /tmp/secrets.yaml   # edit /tmp/secrets.yaml
#   kubectl apply -f /tmp/secrets.yaml
#
# stringData lets you write plain values; Kubernetes base64-encodes them for you.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: platform-system
type: Opaque
stringData:
  # Point at the in-cluster dev Postgres, or your managed database.
  DATABASE_URL: "postgres://postgres:postgres@postgres.platform-system.svc.cluster.local:5432/deploy_platform?sslmode=disable"
  REDIS_PASSWORD: ""
  # Optional: a GitHub PAT raises the language-detection API rate limit.
  GITHUB_TOKEN: ""
---
# Registry credentials Kaniko and Trivy mount to push/pull images. For AWS ECR,
# generate this from `aws ecr get-login-password` (the token is short-lived; in a
# real deployment refresh it with a CronJob or use IRSA). The key MUST be
# .dockerconfigjson.
apiVersion: v1
kind: Secret
metadata:
  name: ecr-credentials
  namespace: platform-builds
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "123456789012.dkr.ecr.us-east-1.amazonaws.com": {
          "username": "AWS",
          "password": "REPLACE_WITH_ECR_TOKEN"
        }
      }
    }
